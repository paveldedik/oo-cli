[project]
name = "oo-cli"
version = "0.1.0"
description = "CLI for the OpenObserve HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
oo = "oo_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/oo_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
