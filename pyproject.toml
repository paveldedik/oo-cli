[project]
# "oo", "oo-cli" and "openobserve" are all taken on PyPI.
name = "openobserve-cli"
version = "0.2.1"
description = "CLI for the OpenObserve HTTP API"
readme = "README.md"
keywords = ["openobserve", "observability", "logs", "metrics", "traces", "cli"]
authors = [{ name = "Pavel Dedík", email = "dedikx@gmail.com" }]
maintainers = [{ name = "Pavel Dedík", email = "dedikx@gmail.com" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
]
dependencies = ["httpx>=0.27"]

[project.scripts]
oo = "oo_cli.cli:main"
# The same command under the distribution's name, so `uvx openobserve-cli ...`
# works without installing anything.
openobserve-cli = "oo_cli.cli:main"

[project.urls]
Homepage = "https://github.com/paveldedik/oo-cli"
Repository = "https://github.com/paveldedik/oo-cli"
Issues = "https://github.com/paveldedik/oo-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.18", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/oo_cli"]

# The agent skill lives at the top of the repository, where agents browsing GitHub find
# it, and rides along in the package so `oo skill install` needs no checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills/openobserve" = "oo_cli/_skill"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # flake8 rules
    "F",     # flake8 rules
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "I",     # isort
    "D2",    # pydocstyle
    "C901",  # maccabe complexity
    "S",     # flake8-bandit
    "UP",    # pyupgrade
    "T10",   # flake8-debugger
]
ignore = [
    "S101",  # asserts are how tests are written
    "D203",
    "D211",
    "D213",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["oo_cli"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
