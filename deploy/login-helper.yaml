# The endpoint `oo auth login` talks to, for deployments that put OpenObserve behind
# a gateway which authenticates users itself — an AWS ALB with an authenticate-oidc
# action, oauth2-proxy, anything of that shape.
#
# Such a gateway takes nothing but its own session cookie and issues it only to a
# browser, so a CLI cannot authenticate on its own. A browser will, however, send
# that cookie to anything behind the gateway. This endpoint reads it off its own
# request and redirects the browser to a port on the caller's own machine, where
# `oo auth login` is listening.
#
# Deploy it behind the same gateway as OpenObserve and route one path to it
# (/cli-login by default, OO_LOGIN_PATH on the CLI side if you move it). The
# redirect target is always 127.0.0.1 and only its port comes from the request, so
# the cookie cannot be sent anywhere but back to the machine the browser runs on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oo-login-helper
data:
  server.py: |
    """Redirect the caller's gateway session cookie to a CLI on their own loopback."""

    import os
    import re
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, urlencode, urlsplit

    # Which cookies belong to the gateway. Everything else the browser sends stays here.
    COOKIE = re.compile(os.environ.get("COOKIE_PATTERN", r"^AWSELBAuthSessionCookie-\d+$"))
    STATE = re.compile(r"^[0-9a-f]{8,64}$")
    LOGIN_PATH = os.environ.get("LOGIN_PATH", "/cli-login")
    PORT = int(os.environ.get("PORT", "8080"))


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            url = urlsplit(self.path)
            if url.path == "/healthz":
                return self.text(200, "ok")
            if url.path != LOGIN_PATH:
                return self.text(404, "not found")

            query = parse_qs(url.query)
            port = query.get("port", [""])[0]
            state = query.get("state", [""])[0]
            if not (port.isdigit() and 1024 <= int(port) <= 65535 and STATE.match(state)):
                return self.text(400, "expected ?port=<1024-65535>&state=<hex>")

            params = {"state": state}
            cookies = self.gateway_cookies()
            if cookies:
                # Whole name=value pairs, so the CLI needs to know none of the names.
                params.update({"c%d" % index: pair for index, pair in enumerate(cookies)})
            else:
                # Names only, never values: enough to see whether the gateway forwards
                # its cookie at all and under what name, without handing one out.
                carried = ", ".join(self.cookie_names()) or "no cookies at all"
                params["error"] = "no cookie matching %s; the request carried %s" % (
                    COOKIE.pattern,
                    carried,
                )
            return self.redirect("http://127.0.0.1:%s/callback?%s" % (port, urlencode(params)))

        def cookie_names(self):
            return [
                part.strip().partition("=")[0]
                for part in self.headers.get("Cookie", "").split(";")
                if part.strip()
            ]

        def gateway_cookies(self):
            pairs = []
            for part in self.headers.get("Cookie", "").split(";"):
                name, separator, value = part.strip().partition("=")
                if separator and COOKIE.match(name):
                    pairs.append("%s=%s" % (name, value))
            return pairs

        def redirect(self, location):
            self.send_response(302)
            self.send_header("Location", location)
            self.send_header("Content-Length", "0")
            self.send_header("Cache-Control", "no-store")
            self.end_headers()

        def text(self, status, body):
            payload = (body + "\n").encode()
            self.send_response(status)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def log_message(self, fmt, *args):
            """Log the path only — the query string names a port on someone's laptop."""
            print("%s %s" % (self.command, urlsplit(self.path).path), flush=True)


    ThreadingHTTPServer(("", PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oo-login-helper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oo-login-helper
  template:
    metadata:
      labels:
        app: oo-login-helper
        # The script is mounted from the ConfigMap, so editing it needs
        # `kubectl rollout restart deploy/oo-login-helper`.
    spec:
      containers:
        - name: server
          image: python:3.13-alpine
          command: ["python", "-u", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app
          configMap:
            name: oo-login-helper
---
apiVersion: v1
kind: Service
metadata:
  name: oo-login-helper
spec:
  selector:
    app: oo-login-helper
  ports:
    - port: 8080
      targetPort: 8080
